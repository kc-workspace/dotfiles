name: Main

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INSTALL_CLI: /tmp/chezmoi.sh
  CHEZMOI_BIN: /tmp/bin

jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - name: Set up repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up chezmoi
        uses: ./.github/actions/setup-chezmoi
      - name: Apply chezmoi config
        run: |
          chezmoi init --apply \
            --force --purge-binary \
            --promptDefaults \
            --source ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} ## For increase rate-limit of GitHub API
      - name: Verify dotfiles
        run: kdf-verify.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} ## For verify gh auth status
          CHEZMOI_SOURCE: ${{ github.workspace }}
          HOMEBREW_NO_SANDBOX_LINUX: "1"

  full:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'kamontat' }}
    steps:
      - name: Set up repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up chezmoi
        uses: ./.github/actions/setup-chezmoi
      - name: Apply chezmoi config
        run: |
          chezmoi init --apply \
            --force --purge-binary \
            --promptDefaults \
            --promptBool "Enable 1Password=true,Enable age=true" \
            --source ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHEZMOI_KEY_TXT_BASE64: ${{ secrets.CHEZMOI_KEY_TXT_BASE64 }}
      - name: Verify dotfiles
        run: kdf-verify.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} ## For verify gh auth status
          CHEZMOI_SOURCE: ${{ github.workspace }}
          HOMEBREW_NO_SANDBOX_LINUX: "1"
      - name: Clean up dotfiles
        if: ${{ always() }}
        run: kdf-cleanup.sh
        env:
          CHEZMOI_SOURCE: ${{ github.workspace }}
